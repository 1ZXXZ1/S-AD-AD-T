#!/usr/bin/env bash
# ============================================================
#  Samba AD DC Auto-Deploy — Configuration File
#  ALT Server 11.1 | Samba 4
# ============================================================
#  Edit this file BEFORE running samba-ad.sh install
#  All modules read variables from here.
# ============================================================

# ---- Network ----
HOST_IP="192.168.31.136"
HOST_SHORTNAME="kushnrserveralt"
DOMAIN="kcrb.local"
REALM="KCRB.LOCAL"
NETBIOS="KCRB"
FQDN="kushnrserveralt.kcrb.local"
GATEWAY="192.168.31.1"
SUBNET="192.168.31.0"
NETMASK="255.255.255.0"
BROADCAST="192.168.31.255"
DHCP_RANGE_START="192.168.31.100"
DHCP_RANGE_END="192.168.31.200"


# ---- DNS ----
DNS_FORWARDER_1="1.1.1.1"
DNS_FORWARDER_2="8.8.8.8"
DNS_BACKEND="SAMBA_INTERNAL"

# ---- Admin ----
ADMIN_USER="Administrator"
ADMIN_PASS='P@$$w0rd'

# ---- Paths ----
SMB_CONF="/etc/samba/smb.conf"
WORKDIR="/var/lib/samba-toolkit"
SHARES_ROOT="/var/lib/samba/shares"
PROFILES_ROOT="/var/lib/samba/profiles"
REDIRECT_ROOT="/var/lib/samba/redirected"
HOMES_ROOT="/var/lib/samba/homes"
DFS_ROOT="/var/lib/samba/dfs"
SNAPSHOTS_ROOT="/var/lib/samba/snapshots"
APPS_ROOT="/var/lib/samba/apps"
SYSVOL_ROOT="/var/lib/samba/sysvol"
BACKUP_DIR="/var/backups/samba"
DHCP_CONF="/etc/dhcp/dhcpd.conf"

ROAMING_PROFILES_ENABLED="yes"

# ---- Shares ----
# List of shares to create: name|path_subdir|read_only|browseable|guest_ok|create_mask|dir_mask
SHARES_LIST="public|public|no|yes|no|0664|0775
departments|departments|no|yes|no|0660|0770
users|users|no|yes|no|0660|0770
profiles|profiles|no|no|no|0666|0777
redirected|redirected|no|no|no|0666|0777
dfs|dfs|yes|yes|no|0644|0755
apps|apps|yes|yes|no|0644|0755"

# ---- DFS Links ----
# name|target_share
DFS_LINKS="public|public
departments|departments
users|users
profiles|profiles"

# ---- Users / Groups ----
# Groups: name|description
GROUPS_LIST="grp_users|Обычные пользователи
grp_admins|Пользователи с административными правами
grp_services|Сервисные учетные записи"

# Default user password (used if CSV has empty password)
DEFAULT_USER_PASS='TempPass!2026'
DEFAULT_PASSWORD_LENGTH=14

# ---- Password Policy ----
PASSWORD_MIN_LENGTH=8
PASSWORD_COMPLEXITY="on"
LOCKOUT_THRESHOLD=3
LOCKOUT_DURATION=30
RESET_LOCKOUT_AFTER=30

# ---- DHCP ----
DHCP_ENABLED="no"
DEFAULT_LEASE_TIME=600
MAX_LEASE_TIME=7200

# ---- Firewall ----
FIREWALL_ENABLED="yes"
# Ports to open: proto/port
# FIX v1.1.3:
#   - Removed tcp/9389 (ADWS) — not supported by Samba AD DC
#   - Removed udp/636 — LDAPS is TCP only
# FIX v1.1.5:
#   - Added udp/123 (NTP) — required for Windows client time sync (gpupdate / Kerberos)
FIREWALL_PORTS="tcp/53
udp/53
udp/123
tcp/88
udp/88
tcp/135
tcp/139
udp/139
tcp/389
udp/389
tcp/445
udp/445
tcp/464
udp/464
tcp/636
tcp/3268
tcp/3269
tcp/49152-49200"

# ---- Chrony/NTP ----
NTP_SUBNET="192.168.31.0/24"
NTP_STRATUM=10

# ---- VFS modules for shares ----
VFS_OBJECTS="acl_xattr shadow_copy2"

# ---- TLS / LDAPS ----
# FIX v1.1.3: Added TLS configuration section
# Set to "yes" to auto-generate self-signed cert and enable LDAPS
TLS_ENABLED="yes"
TLS_DIR="/var/lib/samba/private/tls"
TLS_CERT="${TLS_DIR}/cert.pem"
TLS_KEY="${TLS_DIR}/key.pem"
TLS_CA="${TLS_DIR}/ca.pem"
TLS_DAYS=3650

# ---- Reverse DNS ----
# FIX v1.1.3: Added reverse DNS zone creation
# Set to "yes" to auto-create reverse zone during provisioning
REVERSE_DNS_ENABLED="yes"

# ---- GPO Settings ----
# Folder redirection GPO
GPO_FOLDER_REDIR_ENABLED="yes"
GPO_FOLDER_REDIR_DISPLAY="Folder Redirection Policy"

# USB Restriction GPO
GPO_USB_RESTRICTION_ENABLED="yes"
GPO_USB_RESTRICTION_DISPLAY="USB Storage Restriction"

# Audit GPO
GPO_AUDIT_ENABLED="yes"
GPO_AUDIT_DISPLAY="Audit Logon Logoff"
GPO_AUDIT_LOGON_EVENTS=3

# Drive Maps GPO
GPO_DRIVE_MAPS_ENABLED="yes"
GPO_DRIVE_MAPS_DISPLAY="Shared Folders Drive Maps"
# Drive maps: letter|label|share_path
GPO_DRIVE_MAPS_LIST="P|Общая1|common/папка1
Q|Общая2|common/папка2"

# ---- Apps Auto-Install GPO ----
GPO_APPS_INSTALL_ENABLED="yes"
GPO_APPS_INSTALL_DISPLAY="Apps Auto Install"

# ---- Mail (optional) ----
MAIL_ENABLED="no"
MAIL_DOMAIN="${DOMAIN}"
MAIL_HOST_FQDN="${FQDN}"
VMAIL_ROOT="/var/vmail"
VMAIL_USER="vmail"
VMAIL_GROUP="vmail"
