# ============================================================
# Конфигурационный файл для автоматического развёртывания домена
# Samba AD (Альт Домен)
# ============================================================
# Все параметры загружаются скриптом samba-ad.sh
# Формат: КЛЮЧ=ЗНАЧЕНИЕ (без пробелов вокруг знака =)
# ============================================================

# --- Основные параметры домена ---

# Kerberos-область и DNS-имя домена (верхний регистр для realm)
REALM=TEST.ALT

# DNS-имя домена (нижний регистр)
DOMAIN=test.alt

# Имя NetBIOS (рабочей группы) — до 15 символов, верхний регистр
NETBIOS=TEST

# Полное доменное имя контроллера домена (FQDN)
HOSTNAME=dc1.test.alt

# IPv4-адрес контроллера домена
HOST_IP=192.168.0.132

# Пароль администратора домена (минимум 7 символов, 3 группы:
# заглавные, строчные, цифры, спецсимволы)
ADMIN_PASS='Pa$$word'

# --- Параметры DNS ---

# DNS-бэкенд: SAMBA_INTERNAL или BIND9_DLZ
DNS_BACKEND=SAMBA_INTERNAL

# DNS-форвардеры (через пробел, для разрешения внешних имён)
DNS_FORWARDERS="8.8.8.8"

# --- Параметры сервера ---

# Роль сервера: dc (контроллер домена)
SERVER_ROLE=dc

# Функциональный уровень домена и леса: 2008_R2 или 2016
# ВНИМАНИЕ: уровень 2016 поддерживается не всеми сборками Samba!
# Если 2016 не поддерживается — скрипт автоматически откатится на 2008_R2
FUNCTION_LEVEL=2008_R2

# Поддержка RFC2307 (UID/GID в LDAP) — yes/no
USE_RFC2307=yes

# Тип хранилища БД: tdb или mdb (только для alteratorctl)
BACKEND_STORE=tdb

# Размер БД mdb в ГБ (только если BACKEND_STORE=mdb)
BACKEND_STORE_SIZE=4

# --- NTP ---

# Пул NTP-серверов для синхронизации времени
NTP_POOL="ru.pool.ntp.org"

# --- Сетевой интерфейс ---

# Имя сетевого интерфейса (например: enp0s3, eth0, ens18)
# Используется для настройки resolv.conf на интерфейсе
NETWORK_IFACE=enp0s3

# --- Резервное копирование (опционально) ---

# Директория для резервных копий
BACKUP_DIR=/var/backups/samba-ad

# --- Логирование ---

# Уровень отладки Samba (0-10, для производства — 1)
DEBUG_LEVEL=1
